name: generate-snake

on:
  schedule:
    - cron: "0 0 * * *"   # rebuild once a day
  workflow_dispatch: {}     # allow manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game from contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: imgrooty
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=DC2626&color_dots=161b22,2b0000,7f1d1d,dc2626,ef4444

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: 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
